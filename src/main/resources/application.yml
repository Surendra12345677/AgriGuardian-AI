spring:
  application:
    name: agriguardian-ai
  # Auto-import local dev secrets (Mongo Atlas URI, Gemini key) when present.
  # The file is git-ignored, so this is safe in CI / prod where it won't exist.
  config:
    import: optional:file:./secrets/application-secrets.properties
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agriguardian}
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,circuitbreakers
  endpoint:
    health:
      # `always` so judges can curl /actuator/health and see WHICH downstream
      # is degraded — the app itself is healthy if liveness/readiness are UP.
      show-details: always
  health:
    # Circuit-breaker state is a USEFUL diagnostic but a TERRIBLE liveness
    # signal: if Open-Meteo briefly times out, the breaker opens, the
    # aggregated /actuator/health goes DOWN, Cloud Run's readiness stays
    # UP (correct) but humans curling /health get a misleading red status.
    # We expose breaker state via the dedicated /actuator/circuitbreakers
    # endpoint instead.
    circuitbreakers:
      enabled: false
  metrics:
    tags:
      application: agriguardian-ai

# springdoc removed: incompatible with Spring Boot 4 / Spring 7.
# See note in build.gradle.

agriguardian:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Default to Gemini 3 Pro Preview (hackathon requirement: agents must be
    # built with Gemini 3). On the public generativelanguage.googleapis.com
    # v1beta endpoint the canonical model id is `gemini-3-pro-preview`.
    # Alternatives: `gemini-3-flash-preview` (cheap/fast),
    # `gemini-3.1-pro-preview` (latest 3.1 family), or `gemini-2.5-pro`
    # as a safe fallback if Gemini 3 access is revoked on your key.
    model: ${GEMINI_MODEL:gemini-3-pro-preview}
    # Ordered fallback chain — tried in order if the primary model returns
    # 404 (model not on this project), 429 (quota), or 5xx after retries.
    # Guarantees we keep serving LIVE Gemini results (never the offline
    # deterministic plan) as long as ANY one of these models is reachable
    # for the configured API key. Override with comma-separated env var
    # GEMINI_FALLBACK_MODELS=gemini-2.5-pro,gemini-2.5-flash,gemini-2.0-flash
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3-flash-preview,gemini-2.5-pro,gemini-2.5-flash,gemini-2.0-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    stub-mode: ${GEMINI_STUB_MODE:auto}   # auto | always | never
    timeout-seconds: 30
  # ── Arize AX — hackathon PARTNER TRACK (Arize bucket) ─────────────────
  # Arize gives the agent observability + evaluation "superpowers":
  # every Gemini call + tool invocation is traced via OpenTelemetry to
  # Arize, and the agent uses the Arize MCP server to query its own
  # eval results and self-correct. This is what qualifies the project
  # for the Arize partner bucket.
  arize:
    enabled: ${ARIZE_ENABLED:false}
    api-key: ${ARIZE_API_KEY:}
    space-id: ${ARIZE_SPACE_ID:}
    otlp-endpoint: ${ARIZE_OTLP_ENDPOINT:https://otlp.arize.com/v1}
    project-name: ${ARIZE_PROJECT_NAME:agriguardian-ai}
  mcp:
    # Arize MCP — partner-track qualifier (primary integration).
    # JSON-RPC 2.0 over HTTP/SSE. Keys are passed as request headers.
    arize:
      enabled: ${MCP_ARIZE_ENABLED:false}
      url: ${MCP_ARIZE_URL:https://mcp.arize.com/v1}
      api-key: ${ARIZE_API_KEY:}
      space-id: ${ARIZE_SPACE_ID:}
      timeout-seconds: 15
    # Secondary, optional: MongoDB MCP for action-taking (persisting
    # farm plans). NOT our partner-track submission.
    mongodb:
      enabled: ${MCP_MONGODB_ENABLED:false}
      url: ${MCP_MONGODB_URL:http://localhost:3000/mcp}
      timeout-seconds: 15
  weather:
    base-url: https://api.open-meteo.com/v1
  market:
    # ── Market price configuration ─────────────────────────────────────────
    # No values are hardcoded in Java. All prices, peak months, and algorithm
    # parameters live here and can be overridden via env vars at runtime.
    use-mock: ${MARKET_USE_MOCK:true}
    # Fallback ₹/quintal when the requested crop is not in base-prices.
    default-fallback-price-inr: ${MARKET_DEFAULT_PRICE:2000}
    # Seasonal swing: 0.12 = ±12 % from base price at peak / off-peak.
    seasonal-amplitude: ${MARKET_SEASONAL_AMPLITUDE:0.12}
    # Base prices ₹/quintal.  Override individual crops, e.g.:
    #   AGRIGUARDIAN_MARKET_BASE_PRICES_WHEAT=2600
    base-prices:
      wheat:     ${MARKET_PRICE_WHEAT:2425}
      rice:      ${MARKET_PRICE_RICE:2200}
      maize:     ${MARKET_PRICE_MAIZE:2090}
      soybean:   ${MARKET_PRICE_SOYBEAN:4600}
      cotton:    ${MARKET_PRICE_COTTON:7500}
      sugarcane: ${MARKET_PRICE_SUGARCANE:340}
      onion:     ${MARKET_PRICE_ONION:1800}
      tomato:    ${MARKET_PRICE_TOMATO:1500}
      potato:    ${MARKET_PRICE_POTATO:1200}
      groundnut: ${MARKET_PRICE_GROUNDNUT:6377}
      watermelon: ${MARKET_PRICE_WATERMELON:1950}
      muskmelon:  ${MARKET_PRICE_MUSKMELON:1750}
      sunflower:  ${MARKET_PRICE_SUNFLOWER:5800}
      mustard:    ${MARKET_PRICE_MUSTARD:5650}
      chickpea:   ${MARKET_PRICE_CHICKPEA:5440}
      lentil:     ${MARKET_PRICE_LENTIL:6200}
    # Peak-demand month per crop (1=Jan … 12=Dec).
    peak-months:
      wheat:      ${MARKET_PEAK_WHEAT:4}
      rice:       ${MARKET_PEAK_RICE:10}
      maize:      ${MARKET_PEAK_MAIZE:11}
      soybean:    ${MARKET_PEAK_SOYBEAN:10}
      cotton:     ${MARKET_PEAK_COTTON:12}
      sugarcane:  ${MARKET_PEAK_SUGARCANE:2}
      onion:      ${MARKET_PEAK_ONION:6}
      tomato:     ${MARKET_PEAK_TOMATO:8}
      potato:     ${MARKET_PEAK_POTATO:3}
      groundnut:  ${MARKET_PEAK_GROUNDNUT:11}
      watermelon: ${MARKET_PEAK_WATERMELON:5}
      muskmelon:  ${MARKET_PEAK_MUSKMELON:5}
      sunflower:  ${MARKET_PEAK_SUNFLOWER:4}
      mustard:    ${MARKET_PEAK_MUSTARD:3}
      chickpea:   ${MARKET_PEAK_CHICKPEA:3}
      lentil:     ${MARKET_PEAK_LENTIL:4}

logging:
  level:
    root: INFO
    com.Hackathon.AgriGuardian: DEBUG
  pattern:
    # Include the X-Request-Id (set by CorrelationIdFilter) in every log line.
    level: "%5p [requestId=%X{requestId:-}]"

# ── Resilience4j — circuit breaker / retry for outbound HTTP ───────────
resilience4j:
  circuitbreaker:
    instances:
      openMeteo:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50          # %
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      mongoMcp:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 60
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      openMeteo:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
      mongoMcp:
        maxAttempts: 2
        waitDuration: 300ms
        retryExceptions:
          - com.Hackathon.AgriGuardian.AI.mcp.McpClient$McpException

---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      uri: mongodb://localhost:27017/agriguardian-test
agriguardian:
  gemini:
    stub-mode: always

