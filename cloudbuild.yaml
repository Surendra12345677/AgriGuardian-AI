# ──────────────────────────────────────────────────────────────────────
# AgriGuardian AI — Google Cloud Build configuration
#
# Deploys BOTH services from a single `gcloud builds submit` call:
#   1. agriguardian-ai   — Spring Boot backend  (JDK 17 / Dockerfile at root)
#   2. agriguardian-web  — Next.js 15 dashboard (web/Dockerfile)
#
# Usage (Cloud Shell or local gcloud):
#   gcloud builds submit . \
#     --config=cloudbuild.yaml \
#     --project=agriguardian-ai-496206 \
#     --region=us-central1
#
# Required Cloud Build substitutions (set in GCP Console or --substitutions flag):
#   _REGION            — Cloud Run region  (default: us-central1)
#   _BACKEND_SERVICE   — backend service name
#   _WEB_SERVICE       — frontend service name
#
# Secrets are read from Secret Manager at deploy time (not baked into the image).
# ──────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: agriguardian-ai
  _WEB_SERVICE: agriguardian-web
  _ARIZE_PROJECT: agriguardian-ai

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  # Allow the entire pipeline up to 30 minutes (Gradle + Next.js builds are slow).
  dynamic_substitutions: true

timeout: 1800s

steps:

  # ── Step 1: Build the Spring Boot backend image ────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
      - --tag=gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:latest
      - --cache-from=gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:latest
      - .
    dir: .

  # ── Step 2: Push the backend image ─────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}
    waitFor: [build-backend]

  # ── Step 3: Build the Next.js frontend image ────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/${_WEB_SERVICE}:$COMMIT_SHA
      - --tag=gcr.io/$PROJECT_ID/${_WEB_SERVICE}:latest
      - --cache-from=gcr.io/$PROJECT_ID/${_WEB_SERVICE}:latest
      - --build-arg=NEXT_PUBLIC_ARIZE_PROJECT_NAME=${_ARIZE_PROJECT}
      - .
    dir: web

  # ── Step 4: Push the frontend image ────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-web
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_WEB_SERVICE}
    waitFor: [build-web]

  # ── Step 5: Deploy backend to Cloud Run ────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --port=8080
      - --timeout=300
      - --min-instances=1
      - --max-instances=3
      - --set-env-vars=SPRING_PROFILES_ACTIVE=prod,GEMINI_MODEL=gemini-3-pro-preview,GEMINI_FALLBACK_MODELS=gemini-3-flash-preview,GEMINI_STUB_MODE=auto,ARIZE_ENABLED=true,AGRIGUARDIAN_ARIZE_PROJECT_NAME=${_ARIZE_PROJECT},MCP_ARIZE_ENABLED=false,MCP_MONGODB_ENABLED=false
      - --set-secrets=MONGODB_URI=agriguardian-mongodb-uri:latest,SPRING_DATA_MONGODB_URI=agriguardian-mongodb-uri:latest,GEMINI_API_KEY=agriguardian-gemini-key:latest,ARIZE_API_KEY=agriguardian-arize-key:latest,ARIZE_SPACE_ID=agriguardian-arize-space:latest
    waitFor: [push-backend]

  # ── Step 6: Get backend URL ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: get-backend-url
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        echo "BACKEND_URL=$$URL" > /workspace/backend_url.env
        echo "Backend URL: $$URL"
    waitFor: [deploy-backend]

  # ── Step 7: Deploy frontend to Cloud Run ────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-web
    entrypoint: bash
    args:
      - -c
      - |
        source /workspace/backend_url.env
        gcloud run deploy ${_WEB_SERVICE} \
          --image=gcr.io/$PROJECT_ID/${_WEB_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --port=8080 \
          --timeout=300 \
          --max-instances=3 \
          --set-env-vars="BACKEND_URL=$$BACKEND_URL,NEXT_TELEMETRY_DISABLED=1"
    waitFor: [push-web, get-backend-url]

  # ── Step 8: Print final URLs ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: print-urls
    entrypoint: bash
    args:
      - -c
      - |
        WEB_URL=$(gcloud run services describe ${_WEB_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        source /workspace/backend_url.env
        echo ""
        echo "✅ AgriGuardian AI deployed successfully!"
        echo "   Dashboard : $$WEB_URL"
        echo "   Backend   : $$BACKEND_URL/api/v1"
        echo "   Health    : $$BACKEND_URL/actuator/health"
        echo ""
    waitFor: [deploy-web]

images:
  - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:latest
  - gcr.io/$PROJECT_ID/${_WEB_SERVICE}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_WEB_SERVICE}:latest

